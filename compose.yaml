name: project-management

x-project-environment: &project-environment
  env_file:
    - ${PROJECT_RUNTIME_ENV_FILE:-./.env.local}
  environment:
    PM_HTTP_ADDR: :8082
    MYSQL_DSN: project:${PROJECT_MYSQL_PASSWORD}@tcp(mysql:3306)/project_management?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
    # 平台授权 API 与 Keycloak 后通道是两个独立信任边界，禁止共用地址变量。
    PLATFORM_BASE_URL: ${PROJECT_PLATFORM_BACKCHANNEL_BASE_URL:-http://platform-api:8080}
    OIDC_BACKCHANNEL_BASE_URL: ${PROJECT_OIDC_BACKCHANNEL_BASE_URL:-http://keycloak:8080}
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: default
    TEMPORAL_TASK_QUEUE: project-management
    PROJECT_RUN_WORKER_WITH_API: ${PROJECT_RUN_WORKER_WITH_API:-true}
    GIN_MODE: release

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: project_management
      MYSQL_USER: project
      MYSQL_PASSWORD: ${PROJECT_MYSQL_PASSWORD:?PROJECT_MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${PROJECT_MYSQL_ROOT_PASSWORD:?PROJECT_MYSQL_ROOT_PASSWORD is required}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init/000_databases.sql:/docker-entrypoint-initdb.d/000_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uproject -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_SEEDS: mysql
      MYSQL_USER: project
      MYSQL_PWD: ${PROJECT_MYSQL_PASSWORD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  migrate:
    <<: *project-environment
    build: .
    image: project-management:local
    entrypoint: ["/usr/local/bin/project-migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  project-api:
    <<: *project-environment
    image: project-management:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      default:
      platform:
        aliases: [project-api]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  worker:
    profiles: ["split-runtime"]
    <<: *project-environment
    image: project-management:local
    entrypoint: ["/usr/local/bin/project-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.52.1
    profiles: ["tools"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233

volumes:
  mysql-data:

networks:
  platform:
    name: ${PLATFORM_DOCKER_NETWORK:-basic-platform-local_default}
    external: true
