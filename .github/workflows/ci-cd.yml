name: project-management-ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-management-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.result.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        shell: bash
        env:
          PUSH_REGISTRY: ${{ vars.PROJECT_ACR_PUSH_REGISTRY }}
          PULL_REGISTRY: ${{ vars.PROJECT_ACR_PULL_REGISTRY }}
          NAMESPACE: ${{ vars.PROJECT_ACR_NAMESPACE }}
          REPOSITORY: ${{ vars.PROJECT_ACR_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          : "${PUSH_REGISTRY:?missing PROJECT_ACR_PUSH_REGISTRY}"
          : "${PULL_REGISTRY:?missing PROJECT_ACR_PULL_REGISTRY}"
          : "${NAMESPACE:?missing PROJECT_ACR_NAMESPACE}"
          : "${REPOSITORY:?missing PROJECT_ACR_REPOSITORY}"
          echo "push_image=${PUSH_REGISTRY}/${NAMESPACE}/${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "pull_image=${PULL_REGISTRY}/${NAMESPACE}/${REPOSITORY}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.PROJECT_ACR_PUSH_REGISTRY }}
          username: ${{ secrets.PROJECT_ACR_USERNAME }}
          password: ${{ secrets.PROJECT_ACR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.push_image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - id: result
        shell: bash
        run: echo "image_ref=${{ steps.vars.outputs.pull_image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Deploy project-management independently
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PROJECT_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PROJECT_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PROJECT_DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.PROJECT_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PROJECT_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.PROJECT_DEPLOY_PATH || '/opt/project-management' }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing PROJECT_DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing PROJECT_DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing PROJECT_DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing PROJECT_DEPLOY_KNOWN_HOSTS}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$DEPLOY_PORT" compose.production.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.production.yaml"
          printf -v remote_command 'cd %q && test -f .env.local && PROJECT_IMAGE_REF=%q docker compose --env-file .env.local -f compose.production.yaml pull && PROJECT_IMAGE_REF=%q docker compose --env-file .env.local -f compose.production.yaml up -d --remove-orphans' "$DEPLOY_PATH" "$IMAGE_REF" "$IMAGE_REF"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
