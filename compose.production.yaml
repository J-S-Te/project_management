x-project-runtime: &project-runtime
  image: ${PROJECT_IMAGE_REF:?PROJECT_IMAGE_REF is required}
  env_file:
    - ${PROJECT_RUNTIME_ENV_FILE:-.env.local}
  environment:
    PM_HTTP_ADDR: :8082
    PROJECT_RUN_WORKER_WITH_API: ${PROJECT_RUN_WORKER_WITH_API:-true}
    PLATFORM_BASE_URL: ${PROJECT_PLATFORM_BACKCHANNEL_BASE_URL:-http://platform-api:8080}
    OIDC_BACKCHANNEL_BASE_URL: ${PROJECT_OIDC_BACKCHANNEL_BASE_URL:-http://keycloak:8080}
    TEMPORAL_WORKER_DEPLOYMENT_NAME: ${PROJECT_TEMPORAL_WORKER_DEPLOYMENT_NAME:-project-management}
    TEMPORAL_WORKER_BUILD_ID: ${PROJECT_TEMPORAL_WORKER_BUILD_ID:-project-worker-v1}
    TEMPORAL_WORKER_VERSIONING_ENABLED: ${PROJECT_TEMPORAL_WORKER_VERSIONING_ENABLED:-true}
    TEMPORAL_WORKER_VERSIONING_POLICY: ${PROJECT_TEMPORAL_WORKER_VERSIONING_POLICY:-PINNED}
    TEMPORAL_METRICS_ADDRESS: :9092

services:
  migrate:
    <<: *project-runtime
    entrypoint: ["/usr/local/bin/project-migrate"]
    restart: "no"

  project-api:
    <<: *project-runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      platform:
        aliases: [project-api]
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  worker:
    profiles: ["split-runtime"]
    <<: *project-runtime
    entrypoint: ["/usr/local/bin/project-worker"]
    expose:
      - "9092"
    restart: unless-stopped

networks:
  platform:
    name: ${PLATFORM_DOCKER_NETWORK:-basic-platform-local_default}
    external: true
